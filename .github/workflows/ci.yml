name: CI

on: 
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@4

      - uses: actions/setup-dotnet@4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore
        
      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --logger "trx" --results directory TestResults

      - name: Upload results
        uses: actions/upload-artificat@4
        if: always()
        with:
          name: test-results
          path: TestResults
